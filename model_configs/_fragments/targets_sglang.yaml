  #       warmup: false
  #       log_level: "error"
  #       dit_cpu_offload: true
  #       text_encoder_cpu_offload: true
  #       vae_cpu_offload: true

  sglang_zimage:
    engine_class: "SGLangEngine"
    type: "local"
    task: "text-to-image"
    case_ids: ["zimage_turbo_t2i"]
    params:
      model: "Tongyi-MAI/Z-Image-Turbo"
      <<: *sglang_common
