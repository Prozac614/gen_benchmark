defaults:
  target:
    output_dir: "outputs"
    params: {}
  case:
    params:
      repeats: 5

targets:
  sglang_qwen_2512:
    engine_class: "SGLangEngine"
    type: "local"
    task: "text-to-image"
    case_ids: ["qwen_2512_t2i"]
    params:
      model: "Qwen/Qwen-Image-2512"
      num_gpus: 1
      server_args:
        warmup: false
        log_level: "error"

  sglang_qwen_edit_2511:
    engine_class: "SGLangEngine"
    type: "local"
    task: "image-to-image"
    case_ids: ["qwen_2511_edit"]
    params:
      model: "Qwen/Qwen-Image-Edit-2511"
      num_gpus: 1
      server_args:
        warmup: false
        log_level: "error"

  sglang_wan22_i2v_5b:
    engine_class: "SGLangEngine"
    type: "local"
    task: "image-to-video"
    case_ids: ["wan22_5b_i2v"]
    params:
      model: "Wan-AI/Wan2.2-TI2V-5B-Diffusers"
      num_gpus: 1
      server_args:
        warmup: false
        log_level: "error"

  sglang_wan22_t2v_5b:
    engine_class: "SGLangEngine"
    type: "local"
    task: "text-to-video"
    case_ids: ["wan22_5b_t2v"]
    params:
      model: "Wan-AI/Wan2.2-TI2V-5B-Diffusers"
      num_gpus: 1
      server_args:
        warmup: false
        log_level: "error"

  sglang_flux2:
    engine_class: "SGLangEngine"
    type: "local"
    task: "text-to-image"
    case_ids: ["flux2_t2i"]
    params:
      model: "black-forest-labs/FLUX.2-dev"
      num_gpus: 1
      server_args:
        warmup: false
        log_level: "error"

  sglang_zimage:
    engine_class: "SGLangEngine"
    type: "local"
    task: "text-to-image"
    case_ids: ["zimage_turbo_t2i"]
    params:
      model: "Tongyi-MAI/Z-Image-Turbo"
      num_gpus: 1
      server_args:
        warmup: false
        log_level: "error"
