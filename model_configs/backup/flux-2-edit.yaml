# =============================================================================
# Benchmark Configuration for flux-2/edit
# =============================================================================
defaults:
  case:
    params:
      num_inference_steps: 50
      height: 1024
      width: 1024
      seed: 42
  target:
    output_dir: "outputs"
    params: {}

cases:
  - id: "image_edit_test"
    task: "image"
    prompt: "Transform into anime style"
    params:
      image_path: "https://huggingface.co/datasets/huggingface/documentation-images/resolve/main/diffusers/cat.png"

targets:
  # Local (Diffusers) edit attempt (depends on pipeline support for image conditioning).
  diffusers:
    engine_class: "DiffusersEngine"
    type: "local"
    task: "image"
    params:
      model: "black-forest-labs/FLUX.2-dev"

  sglang:
    engine_class: "SGLangEngine"
    type: "local"
    task: "image"
    params:
      model: "black-forest-labs/FLUX.2-dev"
      num_gpus: 1

  # NOTE: `sm` is treated as a remote backend here (Fal.ai).
  sm:
    engine_class: "FalEngine"
    type: "remote"
    task: "image"
    params:
      fal_model: "fal-ai/flux-2/edit"
