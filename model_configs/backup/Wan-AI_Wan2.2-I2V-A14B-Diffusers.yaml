# =============================================================================
# Benchmark Configuration for Wan-AI/Wan2.2-I2V-A14B-Diffusers
# =============================================================================

# === Test Cases (Workloads) ===
cases:

  # Image-to-Video test case
  - id: "i2v_test"
    prompt: "The girl turn the body and spin around in place"
    task: "video"
    params:
    num_inference_steps: 4
    height: 480
    width: 832
    num_frames: 81
    image_path: "https://huggingface.co/Wan-AI/Wan2.2-I2V-A14B-Diffusers/blob/main/examples/i2v_input.JPG"
    seed: 42

# === Evaluation Targets ===
targets:
  # DiffusersEngine - Wan2.2 I2V A14B (Image-to-Video)
  - name: "diffusers_wan22_i2v_a14b"
    engine_class: "DiffusersEngine"
    type: "local"
    task: "video"
    output_dir: "outputs"
    params:
      model: "Wan-AI/Wan2.2-I2V-A14B-Diffusers"

  # fal.ai - Wan2.2 I2V A14B (Image-to-Video)
  - name: "fal_wan22_i2v_a14b"
    engine_class: "FalEngine"
    type: "remote"
    task: "video"
    output_dir: "outputs"
    params:
      fal_model: "fal-ai/wan/v2.2-a14b/image-to-video"
