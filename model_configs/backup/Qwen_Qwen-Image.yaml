# =============================================================================
# Benchmark Configuration for Qwen/Qwen-Image
# =============================================================================

defaults:
  case:
    params:
      num_inference_steps: 50
      height: 1024
      width: 1024
      seed: 42
  target:
    output_dir: "outputs"
    params: {}

# === Test Cases (Workloads) ===
cases:
  # Text-to-Image test case
  - id: "qwen_t2i_test"
    prompt: "A futuristic cyberpunk city at night, neon lights reflecting on wet streets, highly detailed, 8k"
    task: "image"

# === Evaluation Targets ===
targets:
  # Use target "name" keys to distinguish backends (diffusers / sglang / sm).
  diffusers:
    engine_class: "DiffusersEngine"
    type: "local"
    task: "image"
    params:
      model: "Qwen/Qwen-Image-2512"

  sglang:
    engine_class: "SGLangEngine"
    type: "local"
    task: "image"
    params:
      model: "Qwen/Qwen-Image-2512"
      num_gpus: 1
      # CLI-like knobs (optional):
      # - warmup: excludes warmup from "processing time" in sglang logs; load() will take longer.
      # - enable_torch_compile: first run may be slower due to compilation.
      server_args:
        warmup: true
        enable_torch_compile: true

  # NOTE: `sm` is treated as a remote backend here (Fal.ai).
  sm:
    engine_class: "FalEngine"
    type: "remote"
    task: "image"
    params:
      fal_model: "fal-ai/qwen-image-2512"
