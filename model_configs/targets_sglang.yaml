defaults:
  sglang_common: &sglang_common
    num_gpus: 1
    server_args:
      warmup: false
      log_level: "error"

targets:

  sglang_qwen_2512:
    engine_class: "SGLangEngine"
    type: "local"
    task: "text-to-image"
    case_ids: ["qwen_2512_t2i"]
    params:
      model: "Qwen/Qwen-Image-2512"
      <<: *sglang_common

  sglang_zimage:
    engine_class: "SGLangEngine"
    type: "local"
    task: "text-to-image"
    case_ids: ["zimage_turbo_t2i"]
    params:
      model: "Tongyi-MAI/Z-Image-Turbo"
      <<: *sglang_common

  # -----------------------------------------------------------------------------
  # Wan 2.2 TI2V-5B I2V (480p & 720p)
  # -----------------------------------------------------------------------------
  sglang_wan22_ti2v_5b_i2v_480p:
    engine_class: "SGLangEngine"
    type: "local"
    task: "image-to-video"
    case_ids: ["wan22_ti2v_5b_i2v_480p"]
    params:
      model: "Wan-AI/Wan2.2-TI2V-5B-Diffusers"
      <<: *sglang_common
      server_args:
        dit_layerwise_offload: true 
      env:
        SGLANG_CACHE_DIT_ENABLED: "false"

  sglang_wan22_ti2v_5b_i2v_720p:
