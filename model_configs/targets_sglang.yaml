  sglang_qwen_2512_cachedit:
    engine_class: "SGLangEngine"
    type: "local"
    task: "text-to-image"
    case_ids: ["qwen_2512_t2i"]
    params:
      model: "Qwen/Qwen-Image-2512"
      <<: *sglang_common
      env:
        SGLANG_CACHE_DIT_ENABLED: "true"
        SGLANG_CACHE_DIT_FN: "1"
        SGLANG_CACHE_DIT_BN: "0"
        SGLANG_CACHE_DIT_WARMUP: "4"
        SGLANG_CACHE_DIT_RDT: "0.24"
        SGLANG_CACHE_DIT_MC: "3"
        SGLANG_CACHE_DIT_TAYLORSEER: "false"
        SGLANG_CACHE_DIT_TS_ORDER: "1"
        SGLANG_CACHE_DIT_SCM_PRESET: "none"
        SGLANG_CACHE_DIT_SCM_POLICY: "dynamic"

