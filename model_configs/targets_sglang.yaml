        SGLANG_CACHE_DIT_MC: "3"
        SGLANG_CACHE_DIT_TAYLORSEER: "false"
        SGLANG_CACHE_DIT_TS_ORDER: "1"
        SGLANG_CACHE_DIT_SCM_PRESET: "none"
        SGLANG_CACHE_DIT_SCM_POLICY: "dynamic"
        # secondary transformer (Wan experts)
        SGLANG_CACHE_DIT_SECONDARY_FN: "1"
        SGLANG_CACHE_DIT_SECONDARY_BN: "0"
        SGLANG_CACHE_DIT_SECONDARY_WARMUP: "4"
        SGLANG_CACHE_DIT_SECONDARY_RDT: "0.24"
        SGLANG_CACHE_DIT_SECONDARY_MC: "3"
        SGLANG_CACHE_DIT_SECONDARY_TAYLORSEER: "false"
        SGLANG_CACHE_DIT_SECONDARY_TS_ORDER: "1"

  sglang_wan22_i2v_cachedit:
