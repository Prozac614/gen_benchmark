# =============================================================================
# Benchmark Configuration for Tongyi-MAI/Z-Image-Turbo
# =============================================================================

# === Test Cases (Workloads) ===
cases:
  # Text-to-Image test case
  - id: "tongyi_t2i_test"
    type: "image"
    prompt: "A fantasy landscape with mountains and a river, detailed, vibrant colors"
    num_inference_steps: 9
    height: 1024
    width: 1024
    seed: 42

# === Evaluation Targets ===
targets:
  # DiffusersEngine - Z-Image-Turbo (Image Generation)
  # - name: "diffusers_z_image_turbo"
  #   engine_class: "DiffusersEngine"
  #   type: "local"
  #   task: "image"
  #   model: "Tongyi-MAI/Z-Image-Turbo"
  #   output_dir: "outputs"

  # fal.ai - Z-Image-Turbo (Image Generation)
  - name: "fal_z_image_turbo"
    engine_class: "FalEngine"
    type: "remote"
    task: "image"
    fal_model: "fal-ai/z-image/turbo"
    output_dir: "outputs"
