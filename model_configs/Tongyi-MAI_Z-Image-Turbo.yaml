# =============================================================================
# Benchmark Configuration for Tongyi-MAI/Z-Image-Turbo
# =============================================================================

# === Test Cases (Workloads) ===
cases:
  # Text-to-Image test case
  - id: "tongyi_t2i_test"
    type: "image"
    prompt: "A futuristic cyberpunk city at night, neon lights reflecting on wet streets, highly detailed, 8k"
    num_inference_steps: 30
    height: 1024
    width: 1024

# === Evaluation Targets ===
targets:
  # DiffusersEngine - Z-Image-Turbo (Image Generation)
  - name: "diffusers_z_image_turbo"
    engine_class: "DiffusersEngine"
    type: "local"
    task: "image"
    model: "Tongyi-MAI/Z-Image-Turbo"
    output_dir: "outputs"

  # fal serverless - Z-Image-Turbo (Image Generation)
  - name: "fal_serverless_z_image_turbo"
    engine_class: "FalServerlessEngine"
    type: "remote"
    task: "image"
    fal_app_id: "YOUR_USERNAME/z-image-turbo"
    output_dir: "outputs"

# fal serverless deployment config
fal_serverless:
  machine_type: "GPU-A100"
  num_gpus: 1
  keep_alive: 60
  min_concurrency: 0
  max_concurrency: 2
