# =============================================================================
# Benchmark Configuration for fal-ai/wan/v2.2-a14b/text-to-video
# =============================================================================

# === Test Cases (Workloads) ===
cases:
  # Text-to-Video test case
  - id: "wan_v22_a14b_t2v_test"
    type: "video"
    prompt: "A cat and a dog baking a cake together in a kitchen. The cat is carefully measuring flour, while the dog is stirring the batter with a wooden spoon. The kitchen is cozy, with sunlight streaming through the window."
    # negative_prompt: " "
    num_frames: 81
    resolution: "720p"
    aspect_ratio: "16:9"
    num_inference_steps: 40 
    guidance_scale: 5.0
    guidance_scale_2: 5.0
    seed: 42
    interpolator_model: none
    acceleration: none
    video_quality: high
    video_write_mode: balanced

# === Evaluation Targets ===
targets:
  # fal.ai - Wan v2.2 A14B (Text-to-Video)
  - name: "fal_wan_v22_a14b_t2v"
    engine_class: "FalEngine"
    type: "remote"
    task: "video"
    # fal_model: "fal-ai/wan/v2.2-5b/text-to-video"
    fal_model: "fal-ai/wan/v2.2-a14b/text-to-video"
    output_dir: "outputs"
