  # -----------------------------------------------------------------------------
  # Wan 2.2 T2V-A14B
  # -----------------------------------------------------------------------------
  vllm_omni_wan22_t2v_a14b_480p:
    engine_class: "VllmOmniEngine"
    type: "local"
    task: "text-to-video"
    case_ids: ["wan22_t2v_a14b_480p"]
    params:
      model: "Wan-AI/Wan2.2-T2V-A14B-Diffusers"
      env:
        DIFFUSION_ATTENTION_BACKEND: "FLASH_ATTN"
        ULYSSES_DEGREE: 4
        PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

  vllm_omni_wan22_t2v_a14b_720p:
    engine_class: "VllmOmniEngine"
    type: "local"
    task: "text-to-video"
    case_ids: ["wan22_t2v_a14b_720p"]
    params:
      model: "Wan-AI/Wan2.2-T2V-A14B-Diffusers"
      env:
        DIFFUSION_ATTENTION_BACKEND: "FLASH_ATTN"
        ULYSSES_DEGREE: 4
        PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

  # -----------------------------------------------------------------------------
  # Wan 2.2 I2V-A14B
  # -----------------------------------------------------------------------------
  vllm_omni_wan22_i2v_a14b_480p:
    engine_class: "VllmOmniEngine"
    type: "local"
    task: "image-to-video"
    case_ids: ["wan22_i2v_a14b_480p"]
    params:
      model: "Wan-AI/Wan2.2-I2V-A14B-Diffusers"
      env:
        DIFFUSION_ATTENTION_BACKEND: "FLASH_ATTN"
  
  vllm_omni_wan22_i2v_a14b_720p:
    engine_class: "VllmOmniEngine"
    type: "local"
    task: "image-to-video"
    case_ids: ["wan22_i2v_a14b_720p"]
    params:
      model: "Wan-AI/Wan2.2-I2V-A14B-Diffusers"
      env:
        DIFFUSION_ATTENTION_BACKEND: "FLASH_ATTN"
        ULYSSES_DEGREE: 4
        PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  
  # -----------------------------------------------------------------------------
  # Cache-DiT
  # -----------------------------------------------------------------------------
  vllm_omni_qwen_2512_cachedit:
    engine_class: "VllmOmniEngine"
    type: "local"
    task: "text-to-image"
    case_ids: ["qwen_2512_t2i"]
    params:
      model: "Qwen/Qwen-Image-2512"
      cache_backend: "cache_dit"
      cache_config:
        Fn_compute_blocks: 1
        Bn_compute_blocks: 0
        max_warmup_steps: 4
        residual_diff_threshold: 0.24
        max_continuous_cached_steps: 3
        enable_taylorseer: false
        taylorseer_order: 1
        scm_steps_mask_policy: null
        scm_steps_policy: "dynamic"
      env:
        DIFFUSION_ATTENTION_BACKEND: "FLASH_ATTN"
 
  vllm_omni_qwen_edit_2511_cachedit:
    engine_class: "VllmOmniEngine"
    type: "local"
    task: "image-to-image"
    case_ids: ["qwen_2511_edit"]
