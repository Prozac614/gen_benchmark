targets:
  vllm_omni_qwen_2512:
    engine_class: "VllmOmniEngine"
    type: "local"
    task: "text-to-image"
    case_ids: ["qwen_2512_t2i"]
    params:
      model: "Qwen/Qwen-Image-2512"
      env:
        DIFFUSION_ATTENTION_BACKEND: "FLASH_ATTN"
        
  vllm_omni_qwen_edit_2511:
    engine_class: "VllmOmniEngine"
    type: "local"
    task: "image-to-image"
    case_ids: ["qwen_2511_edit"]
    params:
      model: "Qwen/Qwen-Image-Edit-2511"
      env:
        DIFFUSION_ATTENTION_BACKEND: "FLASH_ATTN"

  vllm_omni_zimage: 
    engine_class: "VllmOmniEngine"
    type: "local"
    task: "text-to-image"
    case_ids: ["zimage_turbo_t2i"]
    params:
      model: "Tongyi-MAI/Z-Image-Turbo"
      env:
        DIFFUSION_ATTENTION_BACKEND: "FLASH_ATTN"

