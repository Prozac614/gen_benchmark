targets:
  vllm_omni_qwen_2512:
    engine_class: "VllmOmniEngine"
    type: "local"
    task: "text-to-image"
    case_ids: ["qwen_2512_t2i"]
    params:
      model: "Qwen/Qwen-Image-2512"
      env:
        DIFFUSION_ATTENTION_BACKEND: "FLASH_ATTN"
        
  vllm_omni_qwen_2512_cachedit:
    engine_class: "VllmOmniEngine"
    type: "local"
    task: "text-to-image"
    case_ids: ["qwen_2512_t2i"]
    params:
      model: "Qwen/Qwen-Image-2512"
      cache_backend: "cache_dit" # or "tea_cache"
      # Align Cache-DiT parameters with SGLang defaults:
      # FN=1, BN=0, warmup=4, rdt=0.24, mc=3, taylorseer=false, order=1, scm_policy=dynamic
      cache_config:
        Fn_compute_blocks: 1
        Bn_compute_blocks: 0
        max_warmup_steps: 4
        residual_diff_threshold: 0.24
        max_continuous_cached_steps: 3
        enable_taylorseer: false
        taylorseer_order: 1
        scm_steps_mask_policy: null
        scm_steps_policy: "dynamic"
      env:
        DIFFUSION_ATTENTION_BACKEND: "FLASH_ATTN"

  vllm_omni_qwen_edit_2511:
