# =============================================================================
# Benchmark Configuration for Wan-AI/Wan2.1-T2V-14B
# =============================================================================

# === Test Cases (Workloads) ===
cases:
  # Text-to-Video test case
  - id: "wan_t2v_test"
    type: "video"
    prompt: "A serene mountain landscape with flowing clouds, cinematic drone shot, golden hour lighting"
    num_inference_steps: 30
    height: 480
    width: 832
    num_frames: 81

# === Evaluation Targets ===
targets:
  # Diffusers - Wan (Video Generation)
  - name: "diffusers_wan"
    engine_class: "DiffusersEngine"
    type: "local"
    task: "video"
    model: "Wan-AI/Wan2.1-T2V-14B-Diffusers"
    output_dir: "outputs"


  # fal.ai - Wan (Video Generation)
  - name: "fal_wan"
    engine_class: "FalEngine"
    type: "remote"
    task: "video"
    fal_model: "fal-ai/wan/v2.1-14b/text-to-video"
    output_dir: "outputs"
    
