# =============================================================================
# Benchmark Configuration for Wan-AI/Wan2.2-TI2V-5B-Diffusers
# =============================================================================

# === Test Cases (Workloads) ===
cases:
  # Text-to-Video test case
  - id: "wan_t2v_test"
    type: "video"
    prompt: "A serene mountain landscape with flowing clouds, cinematic drone shot, golden hour lighting"
    num_inference_steps: 30
    height: 480
    width: 832
    num_frames: 81

  # Image-to-Video test case
  - id: "i2v_test"
    type: "video"
    prompt: "The girl turn the body and spin around in place"
    num_inference_steps: 4
    height: 480
    width: 832
    num_frames: 81
    image_path: "https://huggingface.co/Wan-AI/Wan2.2-TI2V-5B-Diffusers/blob/main/examples/i2v_input.JPG"

# === Evaluation Targets ===
targets:
  # DiffusersEngine - Wan2.2 TI2V 5B (Text-to-Video)
  - name: "diffusers_wan22_ti2v_5b"
    engine_class: "DiffusersEngine"
    type: "local"
    task: "video"
    model: "Wan-AI/Wan2.2-TI2V-5B-Diffusers"
    output_dir: "outputs"

  # fal.ai - Wan2.2 TI2V 5B (Text-to-Video and Image-to-Video)
  - name: "fal_wan22_ti2v_5b"
    engine_class: "FalEngine"
    type: "remote"
    task: "video"
    fal_model: "fal-ai/wan/v2.2-5b/text-to-video"
    fal_model_i2v: "fal-ai/wan/v2.2-5b/image-to-video"
    output_dir: "outputs"
