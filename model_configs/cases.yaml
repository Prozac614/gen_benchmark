defaults:
  target:
    output_dir: "outputs"
    params: {}
  case:
    params:
      seed: 42
      num_inference_steps: 50
      height: 1024
      width: 1024
      repeats: 5

cases:
  # ----------------------------- Qwen-Image-2512 (T2I) -----------------------------
  - id: "qwen_2512_t2i"
    prompt: "A futuristic cyberpunk city at night, neon lights reflecting on wet streets, highly detailed, 8k"
    task: "text-to-image"
    params:
      height: 1024
      width: 1024
      guidance_scale: 4.0
      negative_prompt: " "
      aspect_ratio: "1:1"

  # -------------------------- Qwen-Image-Edit-2511 (I2I) ---------------------------
  - id: "qwen_2511_edit"
    prompt: "Transform into anime style"
    task: "image-to-image"
    params:
      height: 1024
      width: 1024
      custom_shape: [1024, 1024]
      input_image_preprocess: "pad_blur"
      guidance_scale: 4.0
      negative_prompt: " "
      image_path: "figs/cat.png"
      aspect_ratio: "1:1"

  # ------------------------------ Wan 2.2 TI2V-5B (I2V) ----------------------------
  - id: "wan22_5b_i2v"
    prompt: "An astronaut hatching from an egg, on the surface of the moon, the darkness and depth of space realised in the background. High quality, ultrarealistic detail and breath-taking movie-like camera shot."
    task: "image-to-video"
    params:
      image_path: "figs/astronaut.jpg"
      negative_prompt: "Bright tones, overexposed, static, blurred details, subtitles, style, works, paintings, images, static, overall gray, worst quality, low quality, JPEG compression residue, ugly, incomplete, extra fingers, poorly drawn hands, poorly drawn faces, deformed, disfigured, misshapen limbs, fused fingers, still picture, messy background, three legs, many people in the background, walking backwards"
      num_frames: 81
      guidance_scale: 5.0
      height: 700
      width: 1280

  # ------------------------------ Wan 2.2 TI2V-5B (T2V) ----------------------------
  - id: "wan22_5b_t2v"
    prompt: "A cat and a dog baking a cake together in a kitchen. The cat is carefully measuring flour, while the dog is stirring the batter with a wooden spoon. The kitchen is cozy, with sunlight streaming through the window."
    task: "text-to-video"
    params:
      negative_prompt: " " # SGLang's Wan pipeline rejects empty-string negative_prompt.
      num_frames: 81
      guidance_scale: 5.0
      height: 700
      width: 1280

